<text x="78" y="1527" font-size="17">conversation. Sample</text>
<text x="78" y="1551" font-size="17">demo, not production</text>
<text x="78" y="1575" font-size="17">authentication.</text>
<text x="78" y="1630" font-size="16">Preferences are</text>
<text x="78" y="1653" font-size="16">process-local. New</text>
<text x="78" y="1676" font-size="16">conversation clears</text>
<text x="78" y="1699" font-size="16">chat and identity, not</text>
<text x="78" y="1722" font-size="16">saved preferences.</text>
<text x="340" y="1440" font-size="24" class="h">Your purchase + catalog</text>
<rect x="340" y="1458" width="1018" height="73" rx="12" fill="#f8f9fb" stroke="#758393"/>
<text x="358" y="1483" font-size="17" class="h">Account section first</text>
<text x="358" y="1508" font-size="16">Invoice ID / date / exact recorded total. All returned line items and quantities.</text>
<rect x="340" y="1541" width="1018" height="73" rx="12" fill="#f8f9fb" stroke="#758393"/>
<text x="358" y="1566" font-size="17" class="h">Catalog section second</text>
<text x="358" y="1591" font-size="16">Grounded artist/album/track list. Independent counts and partial failure label.</text>
<rect x="340" y="1624" width="1018" height="73" rx="12" fill="#f8f9fb" stroke="#758393"/>
<text x="358" y="1649" font-size="17" class="h">Human support</text>
<text x="358" y="1674" font-size="16">Only returned representative details; no refund or ticket execution.</text>
<rect x="340" y="1719" width="842" height="52" rx="12" fill="#ffffff" stroke="#758393"/>
<text x="355" y="1751" font-size="17">Labeled message input / verification input when waiting</text>
<rect x="1200" y="1719" width="158" height="52" rx="12" fill="#eef0f3" stroke="#758393"/>
<text x="1250" y="1751" font-size="18" class="h">Send</text>
<text x="40" y="1890" font-size="17">Wide rows collapse to a readable phone column. Exact pixel behavior and focus must be verified locally.</text>
