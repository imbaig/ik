<text x="78" y="899" font-size="17">Public catalog. One</text>
<text x="78" y="923" font-size="17">verified customer per</text>
<text x="78" y="947" font-size="17">conversation. Sample</text>
<text x="78" y="971" font-size="17">demo, not production</text>
<text x="78" y="995" font-size="17">authentication.</text>
<text x="78" y="1050" font-size="16">Preferences are</text>
<text x="78" y="1073" font-size="16">process-local. New</text>
<text x="78" y="1096" font-size="16">conversation clears</text>
<text x="78" y="1119" font-size="16">chat and identity, not</text>
