<text x="358" y="903" font-size="17" class="h">Pending request</text>
<text x="358" y="928" font-size="16">Your purchase question is paused. No private records displayed.</text>
<rect x="340" y="961" width="1018" height="73" rx="12" fill="#f8f9fb" stroke="#758393"/>
<text x="358" y="986" font-size="17" class="h">Sample identifier</text>
<text x="358" y="1011" font-size="16">One customer ID, email or phone. Field label + safe inline error. Paste allowed.</text>
<rect x="340" y="1044" width="1018" height="73" rx="12" fill="#f8f9fb" stroke="#758393"/>
<text x="358" y="1069" font-size="17" class="h">Recovery actions</text>
<text x="358" y="1094" font-size="16">Retry • Cancel verification • Catalog-only for a mixed request. Retry limit respected.</text>
<rect x="340" y="1139" width="842" height="52" rx="12" fill="#ffffff" stroke="#758393"/>
<text x="355" y="1171" font-size="17">Labeled message input / verification input when waiting</text>
<rect x="1200" y="1139" width="158" height="52" rx="12" fill="#eef0f3" stroke="#758393"/>
<text x="1250" y="1171" font-size="18" class="h">Send</text>
<text x="40" y="1290" font-size="20" class="h">W-D3 · HC-02/03/05 · S09/10/16</text>
<rect x="40" y="1314" width="1360" height="510" rx="12" fill="#ffffff" stroke="#758393"/>
<rect x="60" y="1334" width="1320" height="58" rx="12" fill="#eef0f3" stroke="#758393"/>
