<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2220" viewBox="0 0 1440 2220" role="img" aria-labelledby="title desc"><title id="title">Mobile wireframes: separate entry, result, verification, loading and invoice</title><desc id="desc">Six phone compositions with customer-facing copy and fixed mock navigation. Review annotations outside frames. Not rendered QA.</desc><rect width="100%" height="100%" fill="#edf0f4"/><style>text{font-family:Arial,sans-serif;fill:#18283f} .bold{font-weight:700}</style>
<text x="40" y="48" font-size="30" class="bold">Phone wireframes · the same questions and outcomes</text>
<text x="40" y="86" font-size="17">Review only: public Chinook fixture; read-only navigation, no provider or account connection. Frames are 390px wide.</text>
<text x="40" y="145" font-size="21" class="bold">1. S01</text>
<text x="40" y="175" font-size="16">First visit · empty / no messages or</text>
