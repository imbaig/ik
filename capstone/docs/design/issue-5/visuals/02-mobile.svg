<text x="58" y="509" font-size="17">purchase.</text>
<rect x="58" y="547" width="354" height="70" rx="8" fill="white" stroke="#718096"/>
<text x="70" y="573" font-size="16" class="bold">Message</text>
<text x="70" y="598" font-size="16">Ask about music or purchases</text>
