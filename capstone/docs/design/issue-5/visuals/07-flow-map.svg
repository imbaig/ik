<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2400" viewBox="0 0 1440 2400" role="img" aria-labelledby="title desc"><title id="title">Actual mock navigation routes and separate recovery alternatives</title><desc id="desc">Empty first visit to public discovery or verified purchases. Mixed verify, cancel and catalog-only are separate routes. Switch reset Keep returns to the switch state. Independent alternative cards have no sequential arrows.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#245b45"/></marker></defs><rect width="1440" height="2400" fill="#edf0f4"/><style>text{font-family:Arial,sans-serif;fill:#18283f}.bold{font-weight:700}</style>
<text x="40" y="50" font-size="30" class="bold">Actions connect real mock states; alternatives stay separate.</text>
<text x="40" y="90" font-size="17">Review map only. Click a state to inspect it in the one-file walkthrough. No account or provider connection.</text>
