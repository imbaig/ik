<text x="760" y="314" font-size="19">One active PR at a time.</text>
<text x="1060" y="292" font-size="26">→</text>
<rect x="1090" y="155" width="310" height="255" rx="12" fill="#ffffff" stroke="#758393"/>
<text x="1110" y="193" font-size="22" class="h">V1 · Validate</text>
