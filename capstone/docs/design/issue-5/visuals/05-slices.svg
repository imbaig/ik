<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="670" viewBox="0 0 1440 670" role="img" aria-labelledby="title desc"><title id="title">Gated future implementation slices</title><desc id="desc">Discovery visuals lead to human decisions, optional authorized spike, bounded implementation and validation. No coding authorization.</desc><rect width="100%" height="100%" fill="#f5f6f8"/>
<style>text{font-family:Arial,sans-serif;fill:#182431} .h{font-weight:700} .muted{fill:#485766}</style>
<text x="40" y="55" font-size="30" class="h">From design evidence to an explicit human decision</text>
<text x="40" y="94" font-size="18">PROPOSED • No implementation authorization • Only Imran approves direction, framework, spec and merging</text>
<rect x="40" y="155" width="310" height="255" rx="12" fill="#ffffff" stroke="#758393"/>
<text x="60" y="193" font-size="22" class="h">G0 · Human gate</text>
