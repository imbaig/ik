<text x="1110" y="288" font-size="19">accessibility, exact-SHA</text>
<text x="1110" y="314" font-size="19">tests/evals and</text>
<text x="1110" y="340" font-size="19">independent review.</text>
<rect x="40" y="460" width="1360" height="130" rx="12" fill="#e9eef5" stroke="#758393"/>
<text x="62" y="500" font-size="22" class="h">STOP before coding until Imran explicitly decides. No migration follows from a recommendation.</text>
<text x="62" y="543" font-size="18">Human findings and human-adopted findings are binding; only Imran may close or waive them.</text>
