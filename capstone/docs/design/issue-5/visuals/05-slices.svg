<text x="60" y="262" font-size="19">findings. D1 direction,</text>
<text x="60" y="288" font-size="19">D2 framework, D3 spec, D4</text>
<text x="60" y="314" font-size="19">scope. All pending.</text>
<text x="360" y="292" font-size="26">→</text>
<rect x="390" y="155" width="310" height="255" rx="12" fill="#ffffff" stroke="#758393"/>
<text x="410" y="193" font-size="22" class="h">P0 · Optional spike</text>
<text x="410" y="236" font-size="19">Separate authorization.</text>
<text x="410" y="262" font-size="19">One engineer-day. Prove</text>
<text x="410" y="288" font-size="19">N/S Gradio paths; report</text>
<text x="410" y="314" font-size="19">failed checks.</text>
<text x="710" y="292" font-size="26">→</text>
<rect x="740" y="155" width="310" height="255" rx="12" fill="#ffffff" stroke="#758393"/>
<text x="760" y="193" font-size="22" class="h">I1 / I2 / I3</text>
<text x="760" y="236" font-size="19">Readable facts →</text>
<text x="760" y="262" font-size="19">responsive recovery →</text>
