[project]
name = "music-store-ai"
version = "0.1.0"
description = "Course capstone: grounded multi-agent music-store support"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0.36,<2.1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0.1,<2",
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain>=1.0,<2",
    "langgraph-supervisor>=0.0.30,<1",
    "gradio>=5.49,<6",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
